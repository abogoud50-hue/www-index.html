<style>

#lv{font-size:12px;background:#fff;color:#000;border-radius:8px;padding:0 7px}

.on{background:#fff!important}.on svg{stroke:#000}

#run{right:calc(env(safe-area-inset-right,0px) + 146px)}

.row{display:flex;gap:10px;margin-top:12px}
.row button,.mb{flex:1;padding:9px;border-radius:12px;border:2px solid rgba(255,255,255,.55);color:#fff;font:800 14px 'Cairo','Segoe UI',sans-serif;background:rgba(255,255,255,.12)}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;font-size:14px}

/* v2 */

#hint{font-size:13px;padding:4px 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tabs .mb{flex:none;padding:6px 10px;font-size:12.5px}
