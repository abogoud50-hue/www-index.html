<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>مزرعتي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;800&display=swap">
<style>
:root{--ink:#3b2414;--wd:#62391b;--w:#9a6233;--p:#fffdf7;--g:#f7c52c;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2f4a22;font:500 .8rem/1.3 Tajawal,system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--p);border:.16rem solid var(--wd);border-radius:.7rem;box-shadow:0 .16rem 0 var(--wd)}
#top{position:fixed;z-index:5;top:max(.5rem,env(safe-area-inset-top,0px));left:max(.6rem,env(safe-area-inset-left,0px));right:max(.6rem,env(safe-area-inset-right,0px));display:flex;gap:.45rem;align-items:flex-start;pointer-events:none}
#top>*{pointer-events:auto}.sp{flex:1;pointer-events:none!important}
.ib{width:2.5rem;height:2.5rem;font-size:1.25rem;display:grid;place-items:center;padding:0}
#lvb{width:3.4rem;height:2.9rem;display:grid;place-items:center;font:400 1.3rem/1 Lalezar;padding:.1rem .2rem}
#lvb small{font:800 .5rem/1 Tajawal;display:block}#xb{height:.35rem;width:100%;background:#fff;border:.1rem solid var(--wd);border-radius:.3rem;overflow:hidden}#xf{height:100%;width:0;background:#3d8a2b}
#cn{height:2.5rem;padding:0 .8rem;display:flex;align-items:center;gap:.3rem;font-weight:800;font-size:1rem;font-variant-numeric:tabular-nums}
#sq{position:fixed;z-index:5;right:max(.6rem,env(safe-area-inset-right,0px));top:calc(max(.5rem,env(safe-area-inset-top,0px)) + 3.35rem);display:grid;gap:.35rem}
#sq .ib{width:2rem;height:2rem;font-size:1rem}
.glow{animation:gl 1s ease-in-out infinite alternate;border-color:#b8820a}
@keyframes gl{from{box-shadow:0 0 0 0 rgba(247,197,44,.9)}to{box-shadow:0 0 .9rem .35rem rgba(247,197,44,.95)}}
#ts{position:fixed;z-index:6;top:calc(max(.5rem,env(safe-area-inset-top,0px)) + 3.2rem);left:50%;transform:translateX(-50%);max-width:60vw;padding:.3rem .8rem;text-align:center;font-weight:800;pointer-events:none;opacity:0;transition:opacity .25s}
#pad{position:fixed;z-index:6;left:max(1.2rem,env(safe-area-inset-left,0px));bottom:max(1rem,env(safe-area-inset-bottom,0px));width:6.2rem;height:6.2rem;border-radius:50%;background:rgba(255,253,247,.3);border:.16rem solid rgba(98,57,27,.6);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:2.8rem;height:2.8rem;margin:-1.4rem;border-radius:50%;background:var(--w);border:.16rem solid var(--wd);pointer-events:none}
#act{position:fixed;z-index:6;right:max(1.4rem,env(safe-area-inset-right,0px));bottom:max(1rem,env(safe-area-inset-bottom,0px));width:5rem;height:5rem;border-radius:50%;background:var(--g);border:.2rem solid var(--wd);box-shadow:0 .25rem 0 var(--wd);display:grid;place-items:center;align-content:center;padding:0;line-height:1}
#act span{font-size:2rem}#act small{font:800 .55rem/1 Tajawal;margin-top:.1rem;max-width:4.4rem;overflow:hidden;white-space:nowrap}
#act:active{transform:translateY(.2rem);box-shadow:0 .05rem 0 var(--wd)}
#chip{position:fixed;z-index:6;right:max(1.4rem,env(safe-area-inset-right,0px));bottom:calc(max(1rem,env(safe-area-inset-bottom,0px)) + 5.6rem);padding:.2rem .7rem;font-weight:800;font-size:.85rem}
#pn{position:fixed;inset:0;z-index:20;background:rgba(40,25,10,.55);display:grid;place-items:center}#pn[hidden]{display:none}
.pb{position:relative;width:min(36rem,94vw);max-height:90vh;overflow:auto;padding:.8rem 1rem;touch-action:pan-y}
.pb h3{margin:0 0 .4rem;font:400 1.5rem Lalezar}.x{position:absolute;top:.5rem;left:.5rem;width:2.2rem;height:2.2rem;border-radius:50%;border:.15rem solid var(--wd);background:#fff;font-size:1.2rem}
.sm{font-size:.7rem;color:#6d4a2d;margin:.1rem 0 .4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(5rem,1fr));gap:.4rem}
.it{display:grid;gap:.1rem;padding:.35rem;text-align:center;background:#fff;border:.15rem solid var(--wd);border-radius:.6rem;font-size:1.3rem}.it b{font-size:.75rem}.it small{font-size:.65rem}.it.on{background:#fff0b0;border-color:#b8820a}
.row{display:grid;grid-template-columns:2rem 1fr auto;gap:.5rem;align-items:center;padding:.35rem 0;border-bottom:.1rem dashed #e5d3b8}.row .e{font-size:1.5rem}.row small{display:block;font-size:.65rem;color:#6d4a2d}
.bt{padding:.3rem .6rem;border:.14rem solid var(--wd);border-radius:.6rem;background:var(--g);font-weight:800;margin-inline-start:.25rem}.bt:disabled{opacity:.45}
.ok{color:#2d7a22}.bar{height:.5rem;background:#fff;border:.1rem solid var(--wd);border-radius:.3rem;overflow:hidden}.bar i{display:block;height:100%;background:#3d8a2b}
</style></head><body>
<canvas id="cv"></canvas>
<div id="top">
  <button class="card" id="lvb"><span id="lvl">1</span><div id="xb"><div id="xf"></div></div></button>
  <div class="sp"></div>
  <div class="card" id="cn">🪙 <span id="coins">0</span><span id="ssn" style="font-size:.65rem;font-weight:500;margin-inline-start:.3rem"></span></div>
  <button class="card ib" id="sb" aria-label="المخزن">📦</button>
  <button class="card ib" id="mb" aria-label="السوق">🏪</button>
  <div class="sp"></div>
  <button class="card ib" id="gb" aria-label="الإعدادات">⚙️</button>
</div>
<div id="sq"><button class="card ib" id="qb" aria-label="المهام">📋</button><button class="card ib" id="ab" aria-label="النشاط">⏳</button><button class="card ib" id="rb" aria-label="موقعي">📍</button></div>
<div class="card" id="ts"></div>
<div id="pad"><i id="knob"></i></div>
<button class="card" id="chip"></button>
<button id="act"><span>✋</span><small></small></button>
<div id="pn" hidden><div class="card pb" id="pb"></div></div>
<script>
(()=>{'use strict';if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
const $=id=>document.getElementById(id);
/* id|اسم|رمز|نوع(v خضار,f زهور,t شجرة مثمرة,o شجرة زينة)|مستوى|سعر البذرة|سعر البيع|دقائق النمو|لون */
const SD=`wheat|قمح|🌾|v|1|3|7|1|#e3b23c
carrot|جزر|🥕|v|2|8|19|2|#f08a24
corn|ذرة|🌽|v|3|18|45|4|#f4c62f
tomato|طماطم|🍅|v|4|40|100|8|#e2483d
potato|بطاطس|🥔|v|5|90|230|15|#c9a26a
rose|ورد جوري|🌹|f|6|120|300|20|#e0345a
cucumber|خيار|🥒|v|6|170|430|35|#5fb548
pepper|فلفل|🌶️|v|7|300|760|100|#d62f2f
cypress|سرو|🌲|o|7|800|2300|300|#2f7a3a
eggplant|باذنجان|🍆|v|8|520|1350|150|#6b3a8a
sunflower|دوار الشمس|🌻|f|8|600|1500|170|#f7c52c
onion|بصل|🧅|v|9|850|2200|210|#d9b0e0
lemon|ليمون|🍋|t|9|1500|4500|360|#f5e04a
pine|صنوبر|🎄|o|9|1800|5200|480|#3f9a46
garlic|ثوم|🧄|v|10|1400|3700|300|#f1ece0
tulip|توليب|🌷|f|10|1700|4400|330|#ff8fb1
melon|بطيخ|🍉|v|11|2300|6200|420|#3f9a46
orange|برتقال|🍊|t|11|3000|9500|600|#f59a23
strawberry|فراولة|🍓|v|12|3800|10500|600|#e0345a
lavender|لافندر|🪻|f|12|4200|11200|660|#9a7be0
apple|تفاح|🍎|t|13|6000|20000|900|#d62f2f
pumpkin|يقطين|🎃|v|13|6000|16500|840|#f08a24
jasmine|ياسمين|💮|o|14|7000|21000|900|#ffffff
peach|خوخ|🍑|t|15|11000|39000|1260|#ffb08a
olive|زيتون|🫒|t|16|18000|66000|1800|#6b7a2a
sakura|سكورا|🌸|o|17|20000|62000|1500|#ffb3c7
date|نخيل التمر|🌴|t|18|32000|125000|2700|#b9791f
mango|مانجو|🥭|t|20|60000|250000|3900|#f5a623
banana|موز|🍌|t|22|100000|450000|5400|#f5d94a
coconut|جوز هند|🥥|t|25|180000|900000|7800|#8a5a2a`.split('\n').map(l=>{const a=l.split('|');return{id:a[0],n:a[1],e:a[2],k:a[3],lvl:+a[4],seed:+a[5],sell:+a[6],min:+a[7],col:a[8]}});
const byId={};SD.forEach(s=>byId[s.id]=s);const isTr=s=>s.k==='t'||s.k==='o';
/* الشجرة: [موسم الثمار (-1 كل المواسم), دقائق حتى تبدأ تثمر, نبذة] */
const TR={cypress:[-1,4,'دائمة الخضرة، تنمو عالية ونحيلة وتعيش عشرات السنين.'],pine:[-1,6,'دائمة الخضرة، تنتج أكواز الصنوبر على مدار السنة.'],lemon:[3,8,'تحتاج سنوات لتثمر في الواقع، وتنضج ثمارها في الشتاء.'],orange:[3,12,'تزهر في الربيع وتنضج برتقالاتها في الشتاء.'],apple:[2,18,'تحتاج بضع سنوات لتثمر، ويُقطف تفاحها في الخريف.'],jasmine:[0,14,'شجيرة عطرية تزهر في الربيع.'],peach:[1,25,'تثمر بعد ٣ سنوات تقريباً وتنضج صيفاً.'],olive:[2,40,'معمّرة بطيئة النمو، يُجنى زيتونها في الخريف.'],sakura:[0,30,'تتفتح أزهارها الوردية في الربيع.'],date:[1,60,'تحتاج سنوات طويلة لتثمر، ويُجنى رطبها في الصيف.'],mango:[1,90,'شجرة ضخمة تثمر بعد سنوات، ومحصولها صيفي.'],banana:[-1,120,'سريعة نسبياً وتثمر في أغلب أوقات السنة.'],coconut:[-1,180,'من أطول الأشجار نمواً، وتثمر على مدار السنة.']};
SD.forEach(s=>{if(isTr(s))s.sell=Math.round(s.sell*(TR[s.id][0]<0?.08:.3))});
const SN=['كل المواسم','الربيع','الصيف','الخريف','الشتاء'],SE=['🌸','☀️','🍂','❄️'],TN=['rgba(255,180,200,.05)','rgba(255,220,80,.06)','rgba(220,110,30,.12)','rgba(120,170,255,.14)'];
const SL=900,SM=SL*1000,seasonAbs=()=>Math.floor(Date.now()/SM),curS=()=>seasonAbs()%4;
function remS(t){const k=byId[t.c],n=Date.now();if(!isTr(k))return Math.max(0,k.min*60-(n-t.t)/1000);
  const q=TR[k.id];let b=(t.y??Math.floor(t.t/SM)-1)+1;while(q[0]>=0&&b%4!==q[0])b++;
  return Math.max(0,(Math.max(t.t+q[1]*60000,b*SM)-n)/1000)}
function prog(t){const k=byId[t.c];if(!isTr(k))return Math.min(1,(Date.now()-t.t)/(k.min*60000));return remS(t)<=0?1:Math.min(.99,(Date.now()-t.t)/(TR[k.id][1]*60000))}
const T=40,M=6,OX=M*T,OY=M*T,WPX=3400,HPX=2600,VH=360,SLOT=44,SW=Math.ceil(WPX/SLOT),KEY='mazraa-v7';
const fmtN=n=>Number(n).toLocaleString('en-US');
const fmtT=s=>s<60?s+'ث':s<3600?Math.floor(s/60)+'د'+(s%60?' '+s%60+'ث':''):Math.floor(s/3600)+'س'+(Math.floor(s%3600/60)?' '+Math.floor(s%3600/60)+'د':'');
const needXp=l=>40*l*l;
const hash=(a,b)=>{let h=Math.imul(a,374761393)^Math.imul(b,668265263);h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967295};
/* الأراضي: [x0,y0,x1,y1,جهة البوابة,إحداثي الطريق] — الأولى هي بيتي */
const PL=[[500,360,1100,900,'S',0],[880,1100,1260,1420,'W',805],[1160,520,1560,880,'S',1010],[1620,420,2100,880,'S',1010],[2160,560,2560,880,'S',1010],[2620,440,3080,880,'S',1010],[320,1120,730,1640,'E',805],[880,1480,1300,1680,'W',805],[1360,1100,1880,1660,'E',1960],[2060,1120,2480,1500,'W',1960],[2540,1100,3080,1660,'N',1010],[320,1850,730,2280,'N',1750],[880,1850,1340,2250,'N',1750],[1400,1880,1880,2300,'N',1750],[2060,1850,2520,2300,'N',1750],[2580,1870,3080,2250,'N',1750]];
const PLY=PL.map((p,i)=>{const j=k=>(hash(i*5+k,i*3+7)-.5)*(i?22:0);return[[p[0]+j(1),p[1]+j(2)],[p[2]+j(3),p[1]+j(4)],[p[2]+j(5),p[3]+j(6)],[p[0]+j(7),p[3]+j(8)]]});
const EG={N:0,E:1,S:2,W:3},GM=PL.map((p,i)=>{const e=EG[p[4]],A=PLY[i][e],B=PLY[i][(e+1)%4],g=[(A[0]+B[0])/2,(A[1]+B[1])/2];return{g,q:(p[4]==='N'||p[4]==='S')?[g[0],p[5]]:[p[5],g[1]]}});
const plotAt=(x,y)=>{for(let i=0;i<PL.length;i++){const p=PL[i];if(x>p[0]+14&&x<p[2]-14&&y>p[1]+14&&y<p[3]-14)return i}return -1};
const HOUSE=[690,372,910,470],SHED=[960,398,1060,470],hoX=800,hoY=492,shX=1010,shY=492;
const HROADS=[[[800,470],[802,910]],[[1010,470],[1010,506],[801,506]]];
const dseg=(x,y,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy||1)));return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy)};
const BK=new Set();for(let sy=0;sy<Math.ceil(HPX/SLOT);sy++)for(let sx=0;sx<SW;sx++){const x=(sx+.5)*SLOT,y=(sy+.5)*SLOT;let b=0;for(const r of[HOUSE,SHED])if(x>r[0]&&x<r[2]&&y>r[1]&&y<r[3]+6)b=1;for(const r of HROADS)for(let k=0;k<r.length-1;k++)if(dseg(x,y,r[k],r[k+1])<30)b=1;if(b)BK.add(sy*SW+sx)}

function fresh(){const inv={},hv={};SD.forEach(s=>{inv[s.id]=0;hv[s.id]=0});inv.wheat=16;const cells=PL.map((p,i)=>i<1?1:0);
  return{v:7,coins:120,xp:0,lvl:1,cells,tl:{},inv,hv,seed:'wheat',gA:1,gB:1,qk:{},st:{seeds:0,plow:0,plant:0,harv:0,sold:0,trees:0,kinds:{},pk:{}},px:800,py:545,m:9}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&d.v===7&&d.cells&&d.cells.length===PL.length?d:null}catch(e){return null}}
let S=load();const returning=!!S;if(!S)S=fresh();else if(S.m!==9){S.px=800;S.py=545}S.m=9;
SD.forEach(s=>{if(typeof S.inv[s.id]!=='number')S.inv[s.id]=0;if(typeof S.hv[s.id]!=='number')S.hv[s.id]=0});if(!byId[S.seed])S.seed='wheat';
let px=S.px,py=S.py;
function save(){try{S.px=px;S.py=py;localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const boughtN=()=>S.cells.reduce((a,b)=>a+b,0)-1;
const landPrice=()=>Math.round(3000*Math.pow(1.35,boughtN())/50)*50;
const tcx=i=>(i%SW+.5)*SLOT,tcy=i=>((i/SW|0)+.5)*SLOT;
const sd=()=>byId[S.seed];
const hvTotal=()=>SD.reduce((a,s)=>a+S.hv[s.id],0),CAP=()=>200+10*S.lvl;

/* ---------- المؤثرات ---------- */
let until=0;const ts=$('ts');
function say(m){ts.textContent=m;ts.style.opacity=1;until=Date.now()+2600}
const fx=[];let swing=0;
function burst(x,y,col,n,coin){for(let k=0;k<n;k++){const a=Math.random()*6.28,s=40+Math.random()*80;fx.push({k:coin?'c':'p',x,y,vx:Math.cos(a)*s,vy:-Math.abs(Math.sin(a))*s-30,col,l:0,m:.7+Math.random()*.4})}}
const ftxt=(x,y,t)=>fx.push({k:'t',x,y,vx:0,vy:-34,t,l:0,m:1.1});

/* ---------- اللعب ---------- */
function gain(x){S.xp+=x;let up=false;while(S.xp>=needXp(S.lvl)){S.xp-=needXp(S.lvl);S.lvl++;S.coins+=S.lvl*40;up=true}
  if(up){const u=SD.filter(c=>c.lvl===S.lvl);say('مستوى '+S.lvl+'! +'+fmtN(S.lvl*40)+' 🪙'+(u.length?' صنف جديد في السوق: '+u.map(c=>c.n).join('، '):''))}}
function plant(i){const s=sd();if((S.inv[s.id]||0)<1){say('لا تملك بذور '+s.n+'، اشترِ من السوق 🏪');return false}
  S.inv[s.id]--;S.st.pk[s.id]=1;S.tl[i]={s:3,c:s.id,t:Date.now()};S.st.plant++;if(isTr(s))S.st.trees++;burst(tcx(i),tcy(i),'#7fd05a',7);return true}
function harvest(i,t,k){if(hvTotal()>=CAP()){say('المخزن ممتلئ، بع من السوق');return false}
  S.hv[k.id]++;S.st.harv++;S.st.kinds[k.id]=1;const xp=Math.max(1,Math.round(Math.sqrt(k.sell)));
  burst(tcx(i),tcy(i),'#f7c52c',7,1);try{navigator.vibrate(8)}catch(e){}ftxt(tcx(i),tcy(i)-26,'+'+xp+' خبرة');gain(xp);if(isTr(k))t.y=seasonAbs();else S.tl[i]={s:2};return true}
let holdA=false,hw=0,fdx=0,fdy=1;
const RD=3;
function wrect(){const tx=Math.floor(px/SLOT),ty=Math.floor(py/SLOT),lx=Math.floor(px/SLOT-.5),ly=Math.floor(py/SLOT-.5);let x0=lx,x1=lx+1,y0=ly,y1=ly+1;
  if(fdy>0){y0=ty;y1=ty+RD-1}else if(fdy<0){y0=ty-RD+1;y1=ty}else if(fdx>0){x0=tx;x1=tx+RD-1}else{x0=tx-RD+1;x1=tx}
  return{x0,y0,x1,y1}}
function tileOK(sx,sy){if(sx<0||sy<0||sx>=SW)return false;const x=(sx+.5)*SLOT,y=(sy+.5)*SLOT;for(let i=0;i<PL.length;i++){const p=PL[i],m=i?14:2;if(x>p[0]+m&&x<p[2]-m&&y>p[1]+m&&y<p[3]-m)return !!S.cells[i]&&!(i===0&&BK.has(sy*SW+sx))}return false}
function area(){const r=wrect(),o=[];for(let sy=r.y0;sy<=r.y1;sy++)for(let sx=r.x0;sx<=r.x1;sx++)if(tileOK(sx,sy))o.push(sy*SW+sx);return o}
const nearTree=i=>{const sx=i%SW,sy=i/SW|0;for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++){if(!a&&!b)continue;const t=S.tl[(sy+b)*SW+sx+a];if(t&&t.s===3&&isTr(byId[t.c]))return true}return false};
function work(){const L=area();swing=.35;if(!L.length)return say('قف داخل أرضك المسوّرة لتعمل فيها');
  const H=[],Pn=[],U=[];for(const i of L){const t=S.tl[i];if(!t)U.push(i);else if(t.s===2)Pn.push(i);else if(remS(t)<=0)H.push(i)}
  if(H.length){for(const i of H){const t=S.tl[i];if(!harvest(i,t,byId[t.c]))break}}
  else if(Pn.length){const s=sd();if((S.inv[s.id]||0)<1)say('لا تملك بذور '+s.n+'، اشترِ من السوق 🏪');else{let n0=0;for(const i of Pn){if((S.inv[s.id]||0)<1)break;if(isTr(s)&&nearTree(i))continue;if(plant(i))n0++}if(!n0&&isTr(s))say('الأشجار تحتاج مسافة بينها')}}
  else if(U.length){for(const i of U)S.tl[i]={s:2};S.st.plow+=U.length;burst(px+fx_*24,py,'#8d5a34',8)}
