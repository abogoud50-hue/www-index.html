<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>مزرعة الأعمال</title>
<style>
:root{--glass:rgba(0,0,0,.5);--gold:#ffd54a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#0d3a18;font-family:'Cairo','Segoe UI',system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.pill{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);padding:6px 16px;border-radius:14px;background:var(--glass);border:1.5px solid rgba(255,255,255,.35);backdrop-filter:blur(6px);font-weight:800;font-size:15px}
#money{right:12px}#lvl{right:150px}
#xp{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);right:12px;width:200px;height:7px;border-radius:5px;background:rgba(0,0,0,.4);overflow:hidden}
#xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9be15d,#ffd54a)}
.btn{position:fixed;border-radius:50%;border:2px solid rgba(255,255,255,.35);color:#fff;font:800 18px 'Cairo','Segoe UI',sans-serif;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);box-shadow:0 4px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.btn:active{transform:scale(.92)}
#act{right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:92px;height:92px}
#act.off{opacity:.45}
#hint{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 136px);padding:5px 14px;border-radius:10px;background:var(--glass);font-size:14px;font-weight:600;opacity:0;transition:opacity .2s}
#joy{position:fixed;left:26px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:120px;height:120px;border-radius:50%;border:2.5px solid rgba(255,255,255,.7);background:rgba(0,0,0,.4)}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;box-sizing:border-box;border-radius:50%;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.85)}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:var(--glass);padding:8px 20px;border-radius:14px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:9;padding:14px}
#box{width:min(420px,100%);background:rgba(0,0,0,.75);border:1.5px solid rgba(255,255,255,.35);border-radius:22px;padding:18px}
#box h2{margin:0 0 8px;font-size:20px;color:var(--gold)}#box p{font-size:15px;line-height:1.7;margin:4px 0}
.row{display:flex;gap:10px;margin-top:12px}
.row button{flex:1;padding:10px;border-radius:14px;border:2px solid rgba(255,255,255,.35);color:#fff;font:800 15px 'Cairo','Segoe UI',sans-serif;background:rgba(255,255,255,.14)}
</style>
</head>
<body>
<div id="money" class="pill">المال: 1000</div>
<div id="lvl" class="pill">المستوى: 1</div>
<div id="xp"><i></i></div>
<div id="hint"></div><div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<button id="act" class="btn off">تفاعل</button>
<div id="modal"><div id="box"></div></div>
<script src="three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a);
const S={money:1000,xp:0,lvl:1,g:1,y:1,a:0,s:1};
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.2;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fd8ff);scene.fog=new THREE.Fog(0xbfeaff,32,80);
const cam=new THREE.PerspectiveCamera(38,1,.1,220);
scene.add(new THREE.HemisphereLight(0xd8f1ff,0x5fbf3a,1.05));
const sun=new THREE.DirectionalLight(0xfff0c8,1.5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
const sh=sun.shadow.camera;sh.left=-24;sh.right=24;sh.top=24;sh.bottom=-24;sh.far=90;sun.shadow.bias=-.0005;
scene.add(sun,sun.target);

/* أدوات الرسم */
const mats={};
const mat=(c,o)=>{const k=c+JSON.stringify(o||{});return mats[k]||(mats[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.55},o||{})))};
const mk=(g,c,x,y,z,o)=>{const m=new THREE.Mesh(g,mat(c,o));m.position.set(x||0,y||0,z||0);m.castShadow=m.receiveShadow=true;return m};
const sz=(m,x,y,z)=>{m.scale.set(x,y===undefined?x:y,z===undefined?x:z);return m};
const G={sph:new THREE.SphereGeometry(1,18,14),cyl:new THREE.CylinderGeometry(1,1,1,16),box:new THREE.BoxGeometry(1,1,1),cone:new THREE.ConeGeometry(1,1,12)};

/* أرض بنسيج عشب */
const cc=document.createElement('canvas');cc.width=cc.height=256;const cx=cc.getContext('2d');
cx.fillStyle='#46d12a';cx.fillRect(0,0,256,256);
for(let i=0;i<500;i++){cx.fillStyle=['#6bf040','#38c01f','#5fe336','#2fae1c'][i%4];cx.globalAlpha=.35;cx.beginPath();cx.arc(Math.random()*256,Math.random()*256,rnd(3,14),0,7);cx.fill()}
const gt=new THREE.CanvasTexture(cc);gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(40,40);gt.encoding=THREE.sRGBEncoding;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),new THREE.MeshStandardMaterial({map:gt,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const path=new THREE.Mesh(new THREE.PlaneGeometry(3.2,100),mat(0xffc785,{roughness:1}));path.rotation.x=-Math.PI/2;path.position.set(3,.03,0);path.receiveShadow=true;scene.add(path);

/* غابة (نسخ مُجمّعة لأداء سلس) */
const tp=[];for(let i=0;i<320;i++){const x=rnd(-58,58),z=rnd(-58,58);if(Math.abs(x)<16&&Math.abs(z)<17||Math.abs(x-3)<2.6)continue;tp.push([x,z,rnd(.9,1.7)])}
const trI=new THREE.InstancedMesh(new THREE.CylinderGeometry(.18,.3,1.4,8),mat(0x9a5b2e),tp.length);
const lfI=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,1),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.6,flatShading:true}),tp.length*2);
trI.castShadow=lfI.castShadow=true;
const D=new THREE.Object3D(),pal=[0x22d44a,0x3be85a,0x14b83a,0x5cf06a,0xffa11f,0xff5fa2].map(c=>new THREE.Color(c));
tp.forEach((t,i)=>{
  D.position.set(t[0],.7*t[2],t[1]);D.scale.set(t[2],t[2],t[2]);D.rotation.set(0,0,0);D.updateMatrix();trI.setMatrixAt(i,D.matrix);
  const c=pal[Math.random()<.14?4+(i&1):i%4];
  D.position.set(t[0],2.2*t[2],t[1]);D.scale.set(1.2*t[2],1.3*t[2],1.2*t[2]);D.rotation.y=i;D.updateMatrix();lfI.setMatrixAt(i*2,D.matrix);lfI.setColorAt(i*2,c);
  D.position.set(t[0],3.2*t[2],t[1]);D.scale.set(.82*t[2],.9*t[2],.82*t[2]);D.updateMatrix();lfI.setMatrixAt(i*2+1,D.matrix);lfI.setColorAt(i*2+1,c.clone().offsetHSL(0,0,.06));
});
scene.add(trI,lfI);
/* زهور */
const fl=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.12,0),new THREE.MeshStandardMaterial({color:0xffffff}),160),fc=[0xff4f8b,0xffe033,0xffffff,0xff8a1f,0xb06bff];
for(let i=0;i<160;i++){let x=rnd(-16,16);if(Math.abs(x-3)<2)x+=4;D.position.set(x,.12,rnd(-17,17));D.scale.set(1,1,1);D.updateMatrix();fl.setMatrixAt(i,D.matrix);fl.setColorAt(i,new THREE.Color(fc[i%5]))}
scene.add(fl);

/* شخصيات لها هوية */
function char(s){
  const g=new THREE.Group(),k=s.skin,P=(m,x,y,z)=>{g.add(m);return m};
  P(sz(mk(G.cyl,s.top,0,.95,0),.27,.62,.22));
  [-1,1].forEach(d=>{
    P(sz(mk(G.cyl,s.bot,d*.11,.3,0),.1,.6,.1));P(sz(mk(G.sph,0x5a3320,d*.11,.05,.05),.12,.07,.17));
    const a=new THREE.Group();a.position.set(d*.33,1.2,0);a.add(sz(mk(G.cyl,s.top,0,-.22,0),.08,.5,.08),sz(mk(G.sph,k,0,-.5,0),.085));g.add(a);(g.userData.arms=g.userData.arms||[]).push(a);
    P(sz(mk(G.sph,0x1b1b1b,d*.09,1.58,.22),.035));
  });
  P(sz(mk(G.sph,k,0,1.55,0),.27,.27,.25));
  P(sz(mk(G.sph,s.hair,0,1.7,-.06),.29,.22,.28));
  if(s.hs)P(sz(mk(G.sph,s.hair,0,1.38,-.13),.26,.33,.17));
  const A=s.acc,c=s.ac||0xffd23f;
  if(A==='straw'){P(sz(mk(G.cyl,c,0,1.84,0),.5,.03,.5));P(sz(mk(G.cyl,c,0,1.9,0),.27,.14,.27))}
  if(A==='chef'){P(sz(mk(G.cyl,0xffffff,0,1.95,0),.25,.26,.25));P(sz(mk(G.sph,0xffffff,0,2.12,0),.3,.2,.3))}
  if(A==='cap')P(sz(mk(G.sph,c,0,1.8,0),.3,.16,.3));
  if(A==='feather'){P(sz(mk(G.cone,0x2e9b3a,0,1.97,0),.36,.32,.36));P(sz(mk(G.box,0xff3d3d,.2,2.05,0),.03,.3,.03))}
  if(A==='turban')P(sz(mk(G.sph,c,0,1.8,0),.31,.2,.31));
  if(A==='smith'){P(sz(mk(G.cyl,0xe53935,0,1.78,0),.29,.05,.27));P(sz(mk(G.box,0x2b2f3a,0,.9,.2),.4,.55,.06))}
  if(A==='coat'){P(sz(mk(G.cyl,0xffffff,0,.95,0),.29,.64,.24));P(sz(mk(G.box,0xe53935,0,1.05,.25),.16,.05,.02));P(sz(mk(G.box,0xe53935,0,1.05,.25),.05,.16,.02))}
  g.traverse(o=>{if(o.isMesh)o.castShadow=true});return g;
}
const RES=[
 {n:'ليلى',r:'مزارعة',d:'تسرّع نمو المحاصيل 25%',c:300,k:'g',v:.75,sp:{skin:0xf6d1b0,hair:0x7a3b1e,hs:1,top:0xff5c8a,bot:0x2b6fd6,acc:'straw'}},
 {n:'حسن',r:'سقّاء',d:'يسرّع النمو 20% إضافية',c:350,k:'g',v:.8,sp:{skin:0xd9a577,hair:0x1a1a1a,top:0x1e90ff,bot:0x1d3f8f,acc:'cap',ac:0x2ec4ff}},
 {n:'سالم',r:'نجّار',d:'يدرّ 2 عملة كل ثانية',c:400,k:'a',v:2,sp:{skin:0xa8714a,hair:0x3a2412,top:0xff8a1f,bot:0x7a4a2a,acc:'cap',ac:0xffcc00}},
 {n:'مريم',r:'خبّازة',d:'تزيد أرباح الحصاد 30%',c:450,k:'y',v:1.3,sp:{skin:0xf6d1b0,hair:0x5a2d1a,hs:1,top:0xffd36b,bot:0xe0544f,acc:'chef'}},
 {n:'يوسف',r:'صيّاد',d:'يدرّ 3 عملات كل ثانية',c:500,k:'a',v:3,sp:{skin:0x7a4a2e,hair:0x111111,top:0x2fb34a,bot:0x6b4a2a,acc:'feather'}},
 {n:'هدى',r:'طبيبة',d:'ترفع الأرباح 20%',c:550,k:'y',v:1.2,sp:{skin:0xd9a577,hair:0x111111,hs:1,top:0x38d0e0,bot:0x38d0e0,acc:'coat'}},
 {n:'عمر',r:'حدّاد',d:'يخفّض سعر البذور للنصف',c:600,k:'s',v:.5,sp:{skin:0xa8714a,hair:0x6b2a12,top:0x6a7280,bot:0x2a2e38,acc:'smith'}},
 {n:'نور',r:'تاجرة',d:'ترفع الأرباح 25%',c:700,k:'y',v:1.25,sp:{skin:0xf6d1b0,hair:0xffb52e,hs:1,top:0xa55bff,bot:0xffd23f,acc:'turban',ac:0xff4fa3}}
];
RES.forEach((r,i)=>{r.h=i>>1;r.hired=false});

/* البيوت */
const roofC=[0xf0462c,0x14c485,0x3d7bff,0xa857ef],wallC=[0xfff1c9,0xffb3c6,0xbfe6ff,0xc9f7b4],hp=[[-11,-6,1],[-11,6,1],[11,-6,-1],[11,6,-1]];
const houses=hp.map((p,i)=>{
  const g=new THREE.Group();
  g.add(sz(mk(G.box,0xb9b9c8,0,.2,0),4.2,.4,3.6),sz(mk(G.box,wallC[i],0,1.5,0),4,2.2,3.4));
  const rf=sz(mk(new THREE.ConeGeometry(1,1,4),roofC[i],0,3.5,0),3.4,1.9,2.7);rf.rotation.y=Math.PI/4;g.add(rf);
  g.add(sz(mk(G.box,0x8a4b22,.6,1,1.72),.85,1.5,.12),sz(mk(G.box,0xffe27a,.6,1.8,1.75),1.1,.12,.12));
  [-1.1,1.5].forEach(x=>g.add(sz(mk(G.box,0x7fd8ff,x,1.7,1.72,{emissive:0x2a6a99,emissiveIntensity:.5}),.75,.75,.1),sz(mk(G.box,roofC[i],x,1.25,1.8),.9,.12,.2)));
  g.add(sz(mk(G.box,0xc0584a,-1.2,3.9,-.3),.5,1.1,.5));
  g.position.set(p[0],0,p[1]);g.rotation.y=p[2]*Math.PI/2;scene.add(g);return{g,x:p[0],z:p[1],dir:p[2],k:0};
});
/* طاحونة */
const wm=new THREE.Group();wm.add(mk(new THREE.CylinderGeometry(.9,1.4,3.6,12),0xfff3dc,0,1.8,0),sz(mk(G.cone,0xe8452c,0,4.2,0),1.15,1.2,1.15));
const bl=new THREE.Group();bl.position.set(0,3.5,1.1);
for(let i=0;i<4;i++){const q=new THREE.Group();q.rotation.z=i*Math.PI/2;q.add(sz(mk(G.box,0xffffff,0,1.2,0),.5,2.4,.06),sz(mk(G.box,0xe8452c,0,.2,0),.12,.4,.1));bl.add(q)}
wm.add(bl,sz(mk(G.sph,0x8a5a33,0,3.5,1.1),.18));wm.position.set(-3,0,-8);scene.add(wm);

/* السكان */
const folks=[];
function spawn(r){const h=houses[r.h],f=char(r.sp);f.position.set(h.x+h.dir*3.2,0,h.z+(h.k++?1.1:-.9));f.rotation.y=h.dir*Math.PI/2;f.userData.t=Math.random()*6;scene.add(f);folks.push(f)}

/* المزرعة */
const plots=[];
for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
  const x=-3+i*2.1,z=j*2.1;scene.add(sz(mk(G.box,0x7a4524,x,.1,z),1.8,.2,1.8),sz(mk(G.box,0x9a6a3c,x,.05,z),1.95,.1,1.95));
  plots.push({x,z,st:0,t:0,T:10,crop:null});
}
function crop(x,z){
  const g=new THREE.Group();
  g.add(sz(mk(G.sph,0x2fe04a,0,.5,0),.3,.38,.3),sz(mk(G.sph,0x1fc23a,.18,.42,.1),.2,.28,.2));
  const c=sz(mk(G.cone,0xff8a1f,0,.3,0),.18,.42,.18);c.rotation.x=Math.PI;c.visible=false;g.add(c);g.userData.root=c;
  g.position.set(x,.15,z);return g;
}
const pl=char({skin:0xe9b98f,hair:0x4a2a14,top:0x2f8bff,bot:0x1f55c8,acc:'straw'});pl.scale.setScalar(1.25);pl.position.set(1,0,9);scene.add(pl);

/* واجهة */
function hud(){$('money').textContent='المال: '+Math.floor(S.money);$('lvl').textContent='المستوى: '+S.lvl;$('xp').firstChild.style.width=Math.min(100,S.xp/(S.lvl*100)*100)+'%'}
let tt;function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,1600)}
function modal(html,btns){$('box').innerHTML=html+'<div class="row"></div>';const row=$('box').lastChild;
  btns.forEach(b=>{const e=document.createElement('button');e.textContent=b[0];e.onclick=()=>{$('modal').style.display='none';b[1]&&b[1]()};row.appendChild(e)});$('modal').style.display='flex'}
function gain(x){S.money+=x;S.xp+=x*.5;while(S.xp>=S.lvl*100){S.xp-=S.lvl*100;S.lvl++;toast('🎉 المستوى '+S.lvl)}hud()}
const cost=()=>Math.round(15*S.s);
let target=null;
function find(){let b=null,bd=99;
  plots.forEach(p=>{const d=Math.hypot(p.x-pl.position.x,p.z-pl.position.z);if(d<1.7&&d<bd){bd=d;b={k:'p',o:p}}});if(b)return b;
  houses.forEach((h,i)=>{const d=Math.hypot(h.x-pl.position.x,h.z-pl.position.z);if(d<4.2&&d<bd){bd=d;b={k:'h',i}}});return b}
const label=t=>!t?'':t.k==='h'?'اطرق منزل أحد السكان':t.o.st===0?'ازرع (−'+cost()+')':t.o.st===1?'ينمو… '+Math.ceil(t.o.t)+'ث':'احصد المحصول';
function doAct(){
  if(!target||$('modal').style.display==='flex')return;
  if(target.k==='p'){const p=target.o;
    if(p.st===0){if(S.money<cost()){toast('المال غير كافٍ');return}S.money-=cost();p.st=1;p.T=p.t=10*S.g;p.crop=crop(p.x,p.z);p.crop.scale.setScalar(.2);scene.add(p.crop);hud()}
    else if(p.st===2){scene.remove(p.crop);p.crop=null;p.st=0;const v=Math.round(45*S.y);gain(v);toast('+'+v+' 🥕')}
  }else{
    const l=RES.filter(r=>r.h===target.i&&!r.hired);
    if(!l.length){modal('<h2>البيت ممتلئ</h2><p>جميع سكان هذا البيت انضموا إلى مزرعتك.</p>',[['حسناً']]);return}
    const r=l[0];
    modal('<h2>'+r.n+' — '+r.r+'</h2><p>أهلاً! يسعدني الانضمام إلى مزرعتك.</p><p>القدرة: '+r.d+'</p><p>التكلفة: '+r.c+' عملة</p>',
      [['انضمام',()=>{if(S.money<r.c){toast('المال غير كافٍ');return}S.money-=r.c;r.hired=true;S[r.k]=r.k==='a'?S.a+r.v:r.k==='s'?Math.min(S.s,r.v):S[r.k]*r.v;spawn(r);hud();toast('انضم '+r.n+' 🎉')}],['لاحقاً']]);
  }
}
$('act').onclick=doAct;

/* تحكم */
const jv={x:0,y:0},keys={},joy=$('joy'),knob=$('knob');let jid=null;
function jm(e){const r=joy.getBoundingClientRect();let dx=e.clientX-r.left-60,dy=e.clientY-r.top-60;const d=Math.hypot(dx,dy);if(d>45){dx*=45/d;dy*=45/d}knob.style.transform='translate('+dx+'px,'+dy+'px)';jv.x=dx/45;jv.y=-dy/45}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
const je=e=>{if(e.pointerId===jid){jid=null;jv.x=jv.y=0;knob.style.transform=''}};joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='e'||e.key===' ')doAct()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
/* تكبير وتصغير: قرصة بإصبعين، وترجع الكاميرا عند رفع اليد */
let zoom=1,zt=1,pd=0,pz=1,wt;const ptr=new Map(),cv=R.domElement,clampZ=v=>Math.max(.6,Math.min(3.2,v));
const pdist=()=>{const[a,b]=[...ptr.values()];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)};
cv.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,e);cv.setPointerCapture(e.pointerId);if(ptr.size===2){pd=pdist();pz=zt}});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,e);if(ptr.size===2&&pd>0)zt=clampZ(pz*pd/pdist())});
const pe=e=>{ptr.delete(e.pointerId);if(ptr.size<2){zt=1;pd=0}};cv.addEventListener('pointerup',pe);cv.addEventListener('pointercancel',pe);
cv.addEventListener('wheel',e=>{e.preventDefault();zt=clampZ(zt+e.deltaY*.002);clearTimeout(wt);wt=setTimeout(()=>zt=1,450)},{passive:false});

function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const clk=new THREE.Clock();let hy=0,lb0='',h4=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clk.getDelta(),.05),T=clk.elapsedTime;
  const ix=jv.x+((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0),iy=jv.y+((keys.w||keys.arrowup)?1:0)-((keys.s||keys.arrowdown)?1:0),m=Math.min(1,Math.hypot(ix,iy));
  const mv=m>.05&&$('modal').style.display!=='flex';
  if(mv){const k=.7071,vx=ix*k-iy*k,vz=-ix*k-iy*k,l=Math.hypot(vx,vz);pl.position.x+=vx/l*5*m*dt;pl.position.z+=vz/l*5*m*dt;hy=Math.atan2(vx,vz);pl.position.y=Math.abs(Math.sin(T*12))*.1}else pl.position.y=0;
  pl.userData.arms.forEach((a,i)=>a.rotation.x=mv?Math.sin(T*12+i*Math.PI)*.9:0);
  pl.rotation.y+=(((hy-pl.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI)*.2;
  pl.position.x=Math.max(-17,Math.min(17,pl.position.x));pl.position.z=Math.max(-18,Math.min(18,pl.position.z));
  houses.forEach(h=>{const dx=pl.position.x-h.x,dz=pl.position.z-h.z,d=Math.hypot(dx,dz);if(d<2.9){pl.position.x=h.x+dx/d*2.9;pl.position.z=h.z+dz/d*2.9}});
  plots.forEach(p=>{
    if(p.st===1){p.t-=dt;const f=1-Math.max(0,p.t)/p.T;p.crop.scale.setScalar(.2+f*.8);if(p.t<=0){p.st=2;p.crop.userData.root.visible=true}}
    if(p.st===2)p.crop.position.y=.15+Math.abs(Math.sin(T*3+p.x))*.08;
  });
  folks.forEach(f=>{f.userData.t+=dt;f.position.y=Math.abs(Math.sin(f.userData.t*2))*.05;f.userData.arms[0].rotation.x=Math.sin(f.userData.t*2)*.25;f.userData.arms[1].rotation.x=-Math.sin(f.userData.t*2)*.25});
  bl.rotation.z+=dt*.9;
  if(S.a>0){S.money+=S.a*dt;S.xp+=S.a*dt*.5}
  if(((T*4)|0)!==h4){h4=(T*4)|0;hud()}
  target=find();const lb=label(target);if(lb!==lb0){lb0=lb;$('hint').textContent=lb;$('hint').style.opacity=lb?1:0}
  $('act').classList.toggle('off',!target||(target.k==='p'&&target.o.st===1));
  zoom+=(zt-zoom)*Math.min(1,dt*6);scene.fog.near=32*zoom;scene.fog.far=80*zoom;
  cam.position.set(pl.position.x+13*zoom,14*zoom,pl.position.z+13*zoom);cam.lookAt(pl.position.x,.8,pl.position.z);
  sun.target.position.copy(pl.position);sun.position.set(pl.position.x+16,30,pl.position.z+10);
  R.render(scene,cam);
}
hud();loop();
})();
